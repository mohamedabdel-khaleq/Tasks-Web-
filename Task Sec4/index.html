<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
</head>
<body>
    <!-- Register Form -->
    <h2>Register Form</h2>
    <form action="/register" method="post">
        <label for="full_name">Full Name:</label>
        <input type="text" id="full_name" name="full_name"
               placeholder="Enter Your Full Name"
               minlength="5" maxlength="50" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter Your Email"
               maxlength="100" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password"
               placeholder="Enter Your Password"
               minlength="8" maxlength="20" required>
        <br><br>
        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password"
               placeholder="Confirm Your Password"
               minlength="8" maxlength="20" required>
        <br><br>
        <button type="submit">Create Account</button>
    </form>
    <hr>

    <!-- Login Form -->
    <h2>Login Form</h2>
    <form action="/login" method="post">
        <label for="login_email">Email:</label>
        <input type="email" id="login_email" name="login_email"
               placeholder="Enter Your Email"
               maxlength="100" required>
        <br><br>
        <label for="login_password">Password:</label>
        <input type="password" id="login_password" name="login_password"
               placeholder="Enter Your Password"
               minlength="8" maxlength="20" required>
        <br><br>
        <button type="submit">Login</button>
    </form>
    <hr>

    <!-- Task Form -->
    <h2>Task Form</h2>
    <form action="/add_task" method="post">
        <label for="task_name">Task Name:</label>
        <input type="text" id="task_name" name="task_name"
               placeholder="Enter Task Name"
               minlength="3" maxlength="100" required>
        <br><br>
        <fieldset>
            <legend>Category:</legend>
            <input type="radio" id="category_work"
                   name="category" value="Work" required>
            <label for="category_work">Work</label>
            <input type="radio" id="category_personal"
                   name="category" value="Personal">
            <label for="category_personal">Personal</label>
        </fieldset>
        <br>

        <label for="priority">Priority:</label>
        <select id="priority" name="priority" required>
            <option value="" disabled selected>Select Priority</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>
        <br><br>

        <label for="due_date">Due Date:</label>
        <input type="date" id="due_date" name="due_date" required>
        <br><br>

        <label for="task_description">Description:</label>
        <textarea id="task_description" name="description"
                  placeholder="Enter Task Description"
                  minlength="10" maxlength="400" required></textarea>
        <br><br>
        <button type="submit">Add Task</button>
        <button type="reset">Reset</button>
    </form>
    <hr>

    <!-- Search Tasks -->
    <h2>Search Tasks</h2>
    <label for="search_tasks">Search:</label>
    <input type="search" id="search_tasks" name="search"
           placeholder="Search Tasks"
           minlength="2" maxlength="100">
    <hr>
    <!-- Tasks Table -->
    <h2>Tasks List</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Task Name</th>
                <th>Category</th>
                <th>Priority</th>
                <th>Due Date</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Study HTML</td>
                <td>Study</td>
                <td>High</td>
                <td>2026-11-01</td>
                <td>Practice HTML forms and tables</td>
            </tr>
            <tr>
                <td>Complete Project</td>
                <td>Work</td>
                <td>Medium</td>
                <td>2026-11-05</td>
                <td>Finish the assigned project</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
